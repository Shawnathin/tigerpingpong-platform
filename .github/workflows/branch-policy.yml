name: Branch policy

on:
  # Keep the existing event for the one protected merge that installs
  # pull_request_target on develop. Remove it in the immediate follow-up PR.
  pull_request:
    types: [opened, synchronize, reopened, edited, ready_for_review]
    branches: [main, develop]
  pull_request_target:
    types: [opened, synchronize, reopened, edited, ready_for_review]
    branches: [main, develop]

permissions:
  contents: read

jobs:
  validate-promotion-path:
    runs-on: ubuntu-latest
    steps:
      - name: Enforce protected branch path, history, and merge method
        env:
          BASE_REF: ${{ github.event.pull_request.base.ref }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          GH_TOKEN: ${{ github.token }}
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
          HEAD_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          TARGET_REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail

          if [ "$BASE_REF" = "main" ]; then
            if [ "$HEAD_REF" != "develop" ] || [ "$HEAD_REPOSITORY" != "$TARGET_REPOSITORY" ]; then
              echo "Pull requests into main must come from this repository's develop branch."
              exit 1
            fi

            HISTORY_STATUS="$(gh api "repos/$TARGET_REPOSITORY/compare/$BASE_SHA...$HEAD_SHA" --jq '.status')"
            if [ "$HISTORY_STATUS" != "ahead" ] && [ "$HISTORY_STATUS" != "identical" ]; then
              echo "The current main commit must be an ancestor of develop before production promotion."
              echo "Open a history-only reconciliation task branch into develop; never resolve overlapping files by hand."
              exit 1
            fi
          fi

          if [ "$BASE_REF" = "develop" ] && { [ "$HEAD_REF" = "main" ] || [ "$HEAD_REF" = "develop" ]; }; then
            echo "Pull requests into develop must come from a dedicated task branch."
            exit 1
          fi

          MERGE_ONLY_RULES="$(
            gh api "repos/$TARGET_REPOSITORY/rules/branches/$BASE_REF" \
              --jq '[.[] | select(.type == "pull_request" and (.parameters.allowed_merge_methods == ["merge"]))] | length'
          )"
          if [ "$MERGE_ONLY_RULES" -lt 1 ]; then
            echo "Protected branches must enforce merge commits through an active GitHub ruleset."
            exit 1
          fi

          echo "Valid promotion path: $HEAD_REF -> $BASE_REF"
          echo "Protected merge method: merge commit only"
