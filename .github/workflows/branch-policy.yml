name: Branch policy

on:
  pull_request:
    types: [opened, synchronize, reopened, edited]
    branches: [main, develop]

permissions:
  contents: read

jobs:
  validate-promotion-path:
    runs-on: ubuntu-latest
    steps:
      - name: Enforce feature to develop to main
        env:
          BASE_REF: ${{ github.event.pull_request.base.ref }}
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
          HEAD_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name }}
          TARGET_REPOSITORY: ${{ github.repository }}
        run: |
          if [ "$BASE_REF" = "main" ]; then
            if [ "$HEAD_REF" != "develop" ] || [ "$HEAD_REPOSITORY" != "$TARGET_REPOSITORY" ]; then
              echo "Pull requests into main must come from this repository's develop branch."
              exit 1
            fi
          fi

          if [ "$BASE_REF" = "develop" ] && { [ "$HEAD_REF" = "main" ] || [ "$HEAD_REF" = "develop" ]; }; then
            echo "Pull requests into develop must come from a dedicated task branch."
            exit 1
          fi

          echo "Valid promotion path: $HEAD_REF -> $BASE_REF"
