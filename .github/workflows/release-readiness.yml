name: Release readiness

on:
  pull_request:
  push:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.12.0
      - uses: actions/setup-node@v4
        with:
          node-version: 20.19.5
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm db:generate
      - run: pnpm typecheck
      - run: pnpm db:validate
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/tigerpingpong_validation
      - run: pnpm test
      - run: pnpm build
        env:
          NEXT_PUBLIC_API_BASE_URL: https://tigerpingpong-platform.onrender.com
          NEXT_PUBLIC_SITE_URL: https://tigerpingpong.ca
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:e2e
      - run: pnpm security:secrets
      - run: pnpm security:audit
