name: Branch policy

on:
  # Keep this event until pull_request_target is present on the default branch
  # and verified there. Remove it only in a later dedicated task.
  pull_request:
    types: [opened, synchronize, reopened, edited, ready_for_review]
    branches: [main, develop]
  pull_request_target:
    types: [opened, synchronize, reopened, edited, ready_for_review]
    branches: [main, develop]

permissions:
  contents: read

jobs:
  validate-promotion-path:
    runs-on: ubuntu-latest
    steps:
      - name: Enforce protected branch path and merge method
        env:
          BASE_REF: ${{ github.event.pull_request.base.ref }}
          GH_TOKEN: ${{ github.token }}
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
          HEAD_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name }}
          TARGET_REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail

          if [ "$BASE_REF" = "main" ]; then
            if [ "$HEAD_REF" != "develop" ] || [ "$HEAD_REPOSITORY" != "$TARGET_REPOSITORY" ]; then
              echo "Pull requests into main must come from this repository's develop branch."
              exit 1
            fi
          fi

          if [ "$BASE_REF" = "develop" ] && { [ "$HEAD_REF" = "main" ] || [ "$HEAD_REF" = "develop" ]; }; then
            echo "Pull requests into develop must come from a dedicated task branch."
            exit 1
          fi

          MERGE_ONLY_RULES="$(
            gh api "repos/$TARGET_REPOSITORY/rules/branches/$BASE_REF" \
              --jq '[.[] | select(.type == "pull_request" and (.parameters.allowed_merge_methods == ["merge"]))] | length'
          )"
          if [ "$MERGE_ONLY_RULES" -lt 1 ]; then
            echo "Protected branches must enforce merge commits through an active GitHub ruleset."
            exit 1
          fi

          echo "Valid promotion path: $HEAD_REF -> $BASE_REF"
          echo "Protected merge method: merge commit only"
