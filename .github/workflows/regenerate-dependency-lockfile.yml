name: Regenerate dependency lockfile

on:
  pull_request:
    paths:
      - package.json
      - apps/**/package.json
      - pnpm-lock.yaml
      - .github/workflows/regenerate-dependency-lockfile.yml

permissions:
  contents: read

jobs:
  regenerate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.12.0
      - uses: actions/setup-node@v4
        with:
          node-version: 20.19.5
      - run: pnpm install --lockfile-only --no-frozen-lockfile
      - uses: actions/upload-artifact@v4
        with:
          name: regenerated-pnpm-lockfile
          path: pnpm-lock.yaml
          retention-days: 1
